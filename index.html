<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeWay Read Aloud</title>
<style>
:root{--navy:#003F83;--orange:#F07D1A;--ink:#1b1f29;--soft:#eef3fa;--line:#d6deea;--good:#1b8a4a;--bad:#c62828}
*{box-sizing:border-box}body{margin:0;font:17px/1.55 Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:#f7f9fc}
header{background:var(--navy);color:#fff;padding:14px 5vw}header h1{margin:0;font-size:20px}header p{margin:2px 0 0;opacity:.85;font-size:14px}
main{max-width:760px;margin:0 auto;padding:12px 4vw 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{font-weight:600;font-size:14px;display:block;margin:8px 0 4px}
input,select{font:17px Inter,Arial;padding:11px;border:1px solid var(--line);border-radius:10px;width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
button{font:600 17px Inter,Arial;padding:14px 20px;border-radius:12px;border:0;background:var(--navy);color:#fff;cursor:pointer;min-height:48px}
button.rec{background:var(--bad)}button.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}button:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap}
#text{font-size:19px;line-height:1.95;white-space:pre-wrap}
.w{padding:1px 2px;border-radius:4px}.w.ok{background:#e3f4ea}.w.mid{background:#fff3cd}.w.bad{background:#fde0e0}.w.om{background:#fde0e0;text-decoration:line-through}.w.nm{background:#eceff3;color:#555}.ins{color:var(--bad);font-style:italic}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sc{background:var(--soft);border-radius:12px;padding:12px;text-align:center}.sc b{display:block;font-size:30px;color:var(--navy)}.sc span{font-size:13px}
.legend span{margin-right:10px;font-size:13px}.status{font-size:15px;color:#444;margin-top:10px}
.timer{font:700 22px Inter,Arial;color:var(--bad);margin-left:6px;align-self:center}

.tabs{display:flex;gap:6px;margin:12px 0 0;position:sticky;top:0;z-index:6;background:#f7f9fc;padding:6px 0}
.tab{flex:1;background:#fff;color:var(--navy);border:2px solid var(--navy);padding:10px 6px;font-size:15px}
.tab.on{background:var(--navy);color:#fff}
#p-read .sticky{top:62px}
.q{margin:14px 0}.q p{margin:0 0 6px}.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:#fff;color:var(--ink);border:1.5px solid var(--line);padding:10px 14px;font-weight:500;min-height:44px;text-align:left}
.opt.sel{border-color:var(--navy);background:#e8eef7}.opt.right{background:#e3f4ea;border-color:var(--good)}.opt.wrong{background:#fde0e0;border-color:var(--bad)}
.fb{font-size:14px;margin-top:6px}.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
input.gap{width:auto;min-width:150px;padding:8px;display:inline-block}
textarea{width:100%;min-height:260px;font:17px/1.6 Inter,Arial;padding:12px;border:1px solid var(--line);border-radius:10px}
.big{font-size:34px;font-weight:700;color:var(--navy)}
.hide{display:none}
.sticky{position:sticky;top:0;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.08)}
</style></head><body>
<header><h1>FreeWay Read Aloud</h1><p id="sub">Read the text aloud. Your teacher gets your result automatically.</p></header>
<main>
<nav class="tabs"><button class="tab on" data-t="read">🎙 Read aloud</button><button class="tab" data-t="ex">✅ Exercises</button><button class="tab" data-t="wr">✍ Writing</button></nav>
<section class="card" id="who"><div class="row hide" id="codeRow"><div><label for="gcode">Group code (ask your teacher)</label><input id="gcode" autocomplete="off" autocapitalize="characters" placeholder="CUA-B1"></div>
<div id="selWrap" class="hide"><label for="studentSel">Your name</label><select id="studentSel" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid #c9d3e3"></select></div></div><p class="status hide" id="whoMsg"></p><div class="row" id="freeRow">
<div><label for="student">Your name</label><input id="student" autocomplete="name" placeholder="Ana López"></div>
<div><label for="group">Your group</label><input id="group" placeholder="Amayuca B1 · Mon-Wed 4 pm"></div></div></section>

<div id="p-read">
<section class="card sticky" id="controls">
<div class="btns"><button id="recBtn">● Start reading</button><button id="stopBtn" class="rec hide">■ I finished</button><span class="timer hide" id="timer">0:00</span></div>
<div class="status" id="status">Find a quiet place. Press "Start reading", read the whole text clearly, then press "I finished".</div></section>

<section class="card"><h2 id="title" style="margin:0 0 8px;color:var(--navy)"></h2><div id="text"></div>
<div class="legend status"><span class="w ok">good</span><span class="w mid">check</span><span class="w bad">practise</span><span class="w om">skipped</span><span class="w nm">name (not graded)</span></div></section>



<section class="card hide" id="results"><h2 style="margin-top:0">Your result</h2>
<div class="scores" id="scores"></div><h3>Words to practise</h3><div id="problems"></div>
<div class="btns" style="margin-top:14px"><button class="alt" id="again">Try again</button></div></section>
</div>
<div id="p-ex" class="hide"><div id="exBox"></div></div>
<div id="p-wr" class="hide"><div id="wrBox"></div></div>
</main>
<script src="readings.js"></script>
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<script>
{
// ===== Teacher: paste your Google Apps Script web-app URL here =====
const API = 'https://script.google.com/macros/s/AKfycbxohVrLs3Hfl-bzx7NQBw_ALsbbycZBlTF1PcsArNyCVVDkhhqweCQYyqIeLN2wlfL2RQ/exec';
// ====================================================================
const $=id=>document.getElementById(id);
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const id=new URLSearchParams(location.search).get('id');
const current=READINGS.find(r=>r.id===id)||READINGS[0];
const norm=w=>w.toLowerCase().replace(/’/g,"'").replace(/[^a-z0-9'ōū-]/g,'');
const names=new Set((current.names||[]).map(norm));
const tokens=t=>t.split(/(\s+)/);
$('title').textContent=current.title; $('sub').textContent=`${current.id} · ${current.level} · Read the text aloud. Your teacher gets your result automatically.`;
$('student').value=ls.get('fw_student','');$('group').value=ls.get('fw_group','');
// Students: if the teacher has a list in the sheet, the student types the group code once and picks the name.
async function loadGroup(code){
  try{const r=await fetch(API+'?action=group&code='+encodeURIComponent(code||'')).then(r=>r.json());
    if(r.open){$('codeRow').classList.add('hide');$('freeRow').classList.remove('hide');return}
    $('freeRow').classList.add('hide');$('codeRow').classList.remove('hide');
    if(!r.names){$('selWrap').classList.add('hide');if(code){$('whoMsg').textContent='We do not know this code. Check it with your teacher.';$('whoMsg').classList.remove('hide')}return}
    $('whoMsg').classList.add('hide');ls.set('fw_code',code);$('group').value=r.group;ls.set('fw_group',r.group);
    $('studentSel').innerHTML='<option value="">Choose your name…</option>'+r.names.map(n=>`<option${n===ls.get('fw_student','')?' selected':''}>${n.replace(/</g,'&lt;')}</option>`).join('');
    $('student').value=$('studentSel').value;$('selWrap').classList.remove('hide');
  }catch(e){$('freeRow').classList.remove('hide')}}
$('gcode').value=ls.get('fw_code','');$('gcode').onchange=()=>loadGroup($('gcode').value.trim().toUpperCase());
$('studentSel').onchange=()=>{$('student').value=$('studentSel').value;ls.set('fw_student',$('studentSel').value)};
loadGroup(ls.get('fw_code',''));
// attempt counter per student, reading and kind (the first attempt is the one that counts)
const attempt=kind=>{const k=`fw_att_${kind}_${current.id}_${($('student').value||'').toLowerCase()}`;const n=(ls.get(k,0)||0)+1;ls.set(k,n);return n};
$('student').onchange=()=>ls.set('fw_student',$('student').value.trim());$('group').onchange=()=>ls.set('fw_group',$('group').value.trim());
function showText(){ $('text').innerHTML=tokens(current.text).map(t=>/\s/.test(t)?t:`<span class="w">${t}</span>`).join(''); }
showText();
const status=m=>$('status').textContent=m;
let rec,chunks=[],t0,tick;
$('recBtn').onclick=async()=>{
  if(!$('student').value.trim()||!$('group').value.trim()){status($('freeRow').classList.contains('hide')?'Write your group code and choose your name first.':'Write your name and your group first.');scrollTo({top:0});return}
  ls.set('fw_student',$('student').value.trim());ls.set('fw_group',$('group').value.trim());
  try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});chunks=[];rec=new MediaRecorder(s);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());assess(new Blob(chunks,{type:rec.mimeType}))};
    rec.start();t0=Date.now();tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('timer').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},500);
    $('recBtn').classList.add('hide');$('stopBtn').classList.remove('hide');$('timer').classList.remove('hide');$('results').classList.add('hide');showText();
    status('Recording… read the whole text. Press "I finished" at the end.');
  }catch(e){status('We cannot use your microphone. Allow the microphone in your browser and try again.')}
};
$('stopBtn').onclick=()=>{clearInterval(tick);if(rec&&rec.state!=='inactive')rec.stop();$('stopBtn').classList.add('hide');$('timer').classList.add('hide')};
$('again').onclick=()=>{$('results').classList.add('hide');showText();$('recBtn').classList.remove('hide');status('Ready. Press "Start reading" when you are ready.');scrollTo({top:0,behavior:'smooth'})};

async function toPCM16k(blob){
  const buf=await blob.arrayBuffer();const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const dec=await ctx.decodeAudioData(buf);const len=Math.ceil(dec.duration*16000);
  const off=new OfflineAudioContext(1,len,16000);const src=off.createBufferSource();src.buffer=dec;src.connect(off.destination);src.start();
  const r=await off.startRendering();const f=r.getChannelData(0);const pcm=new Int16Array(f.length);
  for(let i=0;i<f.length;i++){const v=Math.max(-1,Math.min(1,f[i]));pcm[i]=v<0?v*0x8000:v*0x7FFF}
  return {pcm,duration:dec.duration};
}
async function assess(blob){
  status('Checking your reading… please wait.');
  let tok;try{tok=await fetch(API+'?action=token').then(r=>r.json());if(!tok.token)throw 0}catch(e){status('The checker is not available right now. Try again later or tell your teacher.');$('recBtn').classList.remove('hide');return}
  let pcm,duration;try{({pcm,duration}=await toPCM16k(blob))}catch(e){status('We could not read the recording. Please try again.');$('recBtn').classList.remove('hide');return}
  const fmt=SpeechSDK.AudioStreamFormat.getWaveFormatPCM(16000,16,1);const push=SpeechSDK.AudioInputStream.createPushStream(fmt);push.write(pcm.buffer);push.close();
  const cfg=SpeechSDK.SpeechConfig.fromAuthorizationToken(tok.token,tok.region);cfg.speechRecognitionLanguage='en-US';
  const rcg=new SpeechSDK.SpeechRecognizer(cfg,SpeechSDK.AudioConfig.fromStreamInput(push));
  const pa=new SpeechSDK.PronunciationAssessmentConfig(current.text.replace(/\n+/g,' '),SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark,SpeechSDK.PronunciationAssessmentGranularity.Phoneme,true);
  pa.enableProsodyAssessment=true;pa.applyTo(rcg);
  const segs=[];
  rcg.recognized=(s,e)=>{if(e.result.reason===SpeechSDK.ResultReason.RecognizedSpeech){try{segs.push(JSON.parse(e.result.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult)))}catch(x){}}};
  let finished=false;const done=()=>{if(finished)return;finished=true;rcg.stopContinuousRecognitionAsync(()=>{rcg.close();show(segs,duration)},()=>show(segs,duration))};
  rcg.sessionStopped=done;rcg.canceled=(s,e)=>{if(e.reason===SpeechSDK.CancellationReason.Error){status('Something went wrong. Please try again.');$('recBtn').classList.remove('hide')}else done()};
  rcg.startContinuousRecognitionAsync();
}
function show(segs,duration){
  $('recBtn').classList.remove('hide');$('recBtn').textContent='● Read again';
  const words=[];const flu=[],pro=[];
  segs.forEach(j=>{const b=j.NBest&&j.NBest[0];if(!b)return;const p=b.PronunciationAssessment||{};
    if(p.FluencyScore!=null)flu.push([p.FluencyScore,j.Duration||1]);if(p.ProsodyScore!=null)pro.push([p.ProsodyScore,j.Duration||1]);
    (b.Words||[]).forEach(w=>words.push({w:w.Word,acc:w.PronunciationAssessment?.AccuracyScore??0,err:w.PronunciationAssessment?.ErrorType||'None'}))});
  if(!words.length){status('We did not hear your voice. Check your microphone and try again.');return}
  const ref=tokens(current.text).filter(t=>!/\s/.test(t));const spans=[...$('text').querySelectorAll('.w')];
  let k=0;
  words.forEach(w=>{ if(w.err==='Insertion')return; while(k<ref.length&&!norm(ref[k]))k++;
    if(k<ref.length){const isName=names.has(norm(ref[k]))||names.has(norm(w.w));w.name=isName;
      spans[k].className='w '+(isName?'nm':w.err==='Omission'?'om':(w.err==='Mispronunciation'||w.acc<60)?'bad':w.acc<80?'mid':'ok');k++}});
  words.forEach(w=>{if(names.has(norm(w.w)))w.name=true});
  const graded=words.filter(w=>!w.name&&w.err!=='Insertion');
  const spoken=graded.filter(w=>w.err!=='Omission');
  const acc=spoken.length?spoken.reduce((a,w)=>a+w.acc,0)/spoken.length:0;
  const wavg=a=>{const t=a.reduce((s,x)=>s+x[1],0);return t?a.reduce((s,x)=>s+x[0]*x[1],0)/t:0};
  const refCount=ref.filter(t=>norm(t)).length;const readCount=words.filter(w=>w.err!=='Omission'&&w.err!=='Insertion').length;
  const comp=Math.max(0,Math.min(100,100*readCount/refCount));
  const wcpm=Math.round(spoken.filter(w=>w.err==='None'&&w.acc>=60).length/(duration/60));
  const f=wavg(flu),p=wavg(pro);
  const base=acc*0.4+f*0.2+p*0.2+comp*0.2;const total=Math.round(comp<90?base*comp/100:base);
  $('scores').innerHTML=[['Total',total],['Pronunciation',acc],['Fluency',f],['Intonation',p],['Completeness',comp]].map(([n,v])=>`<div class="sc"><b>${Math.round(v)}</b><span>${n} /100</span></div>`).join('')+`<div class="sc"><b>${wcpm}</b><span>words per minute</span></div>`;
  const prob={};graded.filter(w=>w.err==='Mispronunciation'||(w.err==='None'&&w.acc<60)).forEach(w=>{const x=norm(w.w);if(x)prob[x]=(prob[x]||0)+1});
  const list=Object.keys(prob);
  $('problems').innerHTML=list.length?list.map(w=>`<span class="w bad" style="display:inline-block;margin:3px">${w}</span>`).join(''):'<p>Excellent — no words to practise!</p>';
  $('results').classList.remove('hide');$('results').scrollIntoView({behavior:'smooth'});
  status('Sending your result to your teacher…');
  const payload={student:ls.get('fw_student',''),group:ls.get('fw_group',''),code:ls.get('fw_code',''),attempt:attempt('read'),reading:current.id,title:current.title,total,accuracy:Math.round(acc),fluency:Math.round(f),prosody:Math.round(p),completeness:Math.round(comp),wpm:wcpm,seconds:Math.round(duration),problems:list.join(' ')};
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(r=>r.json()).then(j=>status(j.ok?'Done! Your teacher has your result.':'Your result could not be sent. Tell your teacher.'))
    .catch(()=>status('Your result could not be sent. Check your internet and press "Read again".'));
}
// ===== Tabs =====
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  ['read','ex','wr'].forEach(t=>$('p-'+t).classList.toggle('hide',t!==b.dataset.t));scrollTo({top:0})});
const who=()=>{const s=$('student').value.trim(),g=$('group').value.trim();if(!s||!g){alert($('freeRow').classList.contains('hide')?'Write your group code and choose your name first.':'Write your name and your group first.');scrollTo({top:0});return null}ls.set('fw_student',s);ls.set('fw_group',g);return {s,g}};
const post=p=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(r=>r.json()).catch(()=>({ok:false}));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const openAI=txt=>{const u='https://chatgpt.com/?q='+encodeURIComponent(txt);window.open(u,'_blank')};

// ===== Exercises =====
const E=current.ex; const ans={};
function exHTML(){
  if(!E){$('exBox').innerHTML='<div class="card">No exercises for this reading yet.</div>';return}
  let h='';const btns=(k,opts,labels)=>`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-k="${k}" data-v="${o}">${esc(labels?labels[i]:o)}</button>`).join('')}</div><div class="fb" id="fb-${k}"></div>`;
  h+='<section class="card"><h2>A. True, False or Not Given</h2>'+E.tf.map((x,i)=>`<div class="q"><p>${i+1}. ${esc(x.q)}</p>${btns('A'+(i+1),['T','F','NG'],['True','False','Not given'])}</div>`).join('')+'</section>';
  h+='<section class="card"><h2>B. Understanding the story</h2>'+E.mc.map((x,i)=>`<div class="q"><p>${i+1}. ${esc(x.q)}</p>${btns('B'+(i+1),['a','b','c','d'],x.o.map((o,k)=>'abcd'[k]+') '+o))}</div>`).join('')+
    (E.seq?`<h3 style="margin:18px 0 6px">Part 2 · Story in pictures</h3><p>Tap the pictures in the order they appear in the text (1 to 6). Tap <b>Reset</b> to start again.</p><div class="seqg" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px">${'ABCDEF'.split('').map(L=>`<div class="seqc" data-l="${L}" style="position:relative;cursor:pointer;border:3px solid transparent;border-radius:10px;overflow:hidden"><img src="img/${current.id}/${L}.jpg" alt="Picture ${L}" style="width:100%;display:block"><b style="position:absolute;left:6px;top:4px;background:#fff;border-radius:6px;padding:0 6px">${L}</b><span class="seqn" style="position:absolute;right:6px;top:4px;background:#003F83;color:#fff;border-radius:50%;min-width:28px;height:28px;display:none;align-items:center;justify-content:center;font-weight:700"></span><div class="fb" id="fb-BP${L}" style="padding:2px 6px"></div></div>`).join('')}</div><div class="btns"><button class="alt" id="seqReset" type="button">Reset</button></div><p class="status">Then write three sentences about three pictures in your notebook (${E.seq.tense}).</p>`:'')+'</section>';
  h+='<section class="card"><h2>C. Words in context</h2>'+E.toefl.map((x,i)=>`<div class="q"><p>${i+1}. ${esc(x.q)}</p>${btns('C'+(i+1),['a','b','c','d'],x.o.map((o,k)=>'abcd'[k]+') '+o))}</div>`).join('')+'</section>';
  let n=0;const sum=esc(E.summary.text).replace(/\((\d)\)\s*_+/g,(m,d)=>`(${d}) <input class="gap" data-k="D${d}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><span class="fb" id="fb-D${d}"></span>`);
  h+=`<section class="card"><h2>D. Complete the summary</h2><p>All the missing words are in the Key vocabulary.</p><p style="line-height:2.4;font-style:italic">${sum}</p></section>`;
  h+=`<section class="card"><h2>G. Grammar: ${esc(E.gtitle)}</h2>`+E.grammar.map((x,i)=>`<div class="q"><p>${i+1}. ${esc(x.q).replace(/_{3,}/,`<input class="gap" data-k="G${i+1}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`)} <span class="fb" id="fb-G${i+1}"></span></p></div>`).join('')+'</section>';
  if(E.hunt){const H=E.hunt;h+=`<section class="card"><h2>G · Part 3. Word hunt</h2><p>Read <b>paragraphs ${H.range[0]} to ${H.range[1]}</b> again and find the words. Write them in the boxes, separated by commas. Write a word every time it appears.</p>`+H.targets.map((t,k)=>`<h3 style="margin:14px 0 6px">${'AB'[k]}. ${esc(t.name)}${t.note?` <small style="color:#666">(${esc(t.note.replace(/\*/g,''))})</small>`:''}</h3>`+Object.entries(t.items).map(([p,ws])=>`<div class="q"><p>Paragraph ${p} · <b>${ws.length}</b> ${ws.length===1?'word':'words'}</p>${ws.length?`<input class="gap hunt" style="width:100%" data-h="${k}-${p}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="word, word, word">`:'<p class="status">Nothing here: this paragraph has none.</p>'}<div class="fb" id="fb-W${k}-${p}"></div></div>`).join('')).join('')+'</section>'}
  if(E.fix)h+=`<section class="card"><h2>H. Fix the sentence</h2><p>The <u>underlined</u> part of each sentence has <b>one</b> mistake: spelling, grammar, word order or a false fact. Correct the sentence in the box.</p>`+E.fix.map((x,i)=>`<div class="q"><p>${i+1}. <span style="color:#555">${x.u?esc(x.u[0])+' <u>'+esc(x.u[1])+'</u> '+esc(x.u[2]):esc(x.w)}</span></p><input class="gap fix" style="width:100%" data-k="H${i+1}" value="${esc(x.w)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><div class="fb" id="fb-H${i+1}"></div></div>`).join('')+'</section>';
  h+='<section class="card"><div class="btns"><button id="checkEx">Check my answers</button></div><div id="exRes"></div></section>';
  $('exBox').innerHTML=h;
  $('exBox').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;ans[b.dataset.k]=b.dataset.v;$('exBox').querySelectorAll(`.opt[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.toggle('sel',x===b))});
  $('checkEx').onclick=checkEx;
  if(E.seq){const cells=[...$('exBox').querySelectorAll('.seqc')];const paint=()=>cells.forEach(c=>{const n=ans['BP'+c.dataset.l];const sp=c.querySelector('.seqn');sp.textContent=n||'';sp.style.display=n?'flex':'none';c.style.borderColor=n?'#003F83':'transparent'});
    cells.forEach(c=>c.onclick=()=>{if(c.dataset.lock)return;const k='BP'+c.dataset.l;if(ans[k])return;const used=cells.filter(x=>ans['BP'+x.dataset.l]).length;ans[k]=String(used+1);paint()});
    $('seqReset').onclick=()=>{if(cells[0].dataset.lock)return;cells.forEach(c=>delete ans['BP'+c.dataset.l]);paint()};paint();}
}
const expand=t=>t.replace(/\bcan't\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/\bcannot\b/g,'can not').replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will');
const X=t=>clean(expand(clean(t)));
const same=(a,b)=>String(b).split('/').some(x=>X(a)===X(x));
// Fix the sentence: the rest of the sentence must stay, the underlined part must contain the correction
function fixOk(mine,wrong,right){ if(same(mine,right))return true;
  const W=X(wrong).split(' '),R=X(right).split(' '),S=X(mine).split(' ').filter(Boolean);
  let i=0;while(i<W.length&&i<R.length&&W[i]===R[i])i++;let j=0;while(j<W.length-i&&j<R.length-i&&W[W.length-1-j]===R[R.length-1-j])j++;
  const pre=W.slice(0,i),suf=W.slice(W.length-j),rm=R.slice(i,R.length-j),wm=W.slice(i,W.length-j);
  if(S.length<pre.length+suf.length||pre.some((w,k)=>S[k]!==w)||suf.some((w,k)=>S[S.length-suf.length+k]!==w))return false;
  const sm=S.slice(pre.length,S.length-suf.length);if(sm.join(' ')===wm.join(' ')||sm.length>rm.length+2)return false;
  let k=0;for(const w of sm)if(k<rm.length&&w===rm[k])k++;return k===rm.length&&rm.length>0}
const clean=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim();
async function checkEx(){
  const w=who();if(!w)return;
  $('exBox').querySelectorAll('input.gap:not(.hunt)').forEach(i=>ans[i.dataset.k]=i.value);
  const keys=[];E.tf.forEach((x,i)=>keys.push(['A'+(i+1),x.a,'paragraph '+x.p]));E.mc.forEach((x,i)=>keys.push(['B'+(i+1),x.a]));if(E.seq)'ABCDEF'.split('').forEach((L,i)=>keys.push(['BP'+L,String(E.seq.key[i])]));E.toefl.forEach((x,i)=>keys.push(['C'+(i+1),x.a]));
  E.summary.keys.forEach((k,i)=>keys.push(['D'+(i+1),k]));E.grammar.forEach((x,i)=>keys.push(['G'+(i+1),x.a,'paragraph '+x.p]));
  (E.fix||[]).forEach((x,i)=>keys.push(['H'+(i+1),x.a,x.t]));
  const missing=keys.filter(([k])=>!String(ans[k]||'').trim()).length;
  const unchanged=(E.fix||[]).filter((x,i)=>clean(ans['H'+(i+1)])===clean(x.w)).length;
  if(unchanged&&!confirm(`You did not change ${unchanged} sentence(s) in exercise H. Check anyway?`))return;
  if(missing&&!confirm(`You have ${missing} empty answers. Check anyway?`))return;
  let ok=0;const mistakes=[];const per={A:[0,0],B:[0,0],C:[0,0],D:[0,0],G:[0,0]};if(E.fix)per.H=[0,0];
  let hOk=0,hTot=0;if(E.hunt){per.W=[0,0];E.hunt.targets.forEach((t,k)=>Object.entries(t.items).forEach(([p,ws])=>{if(!ws.length)return;const inp=$('exBox').querySelector(`input.hunt[data-h="${k}-${p}"]`);const mine=String(inp?inp.value:'').split(/[,;\n]+|\s+/).map(clean).filter(Boolean);const pool=[...mine];const miss=[];
    let cellOk=0;ws.forEach(w=>{const i=pool.indexOf(clean(w));if(i>=0){pool.splice(i,1);cellOk++}else miss.push(w)});const got=Math.max(0,cellOk-pool.length);hOk+=got;hTot+=ws.length;
    const fb=$(`fb-W${k}-${p}`);if(fb){fb.className='fb '+(got<ws.length?'no':'ok');fb.textContent=got<ws.length?` ${got}/${ws.length}${miss.length?' · Missing: '+miss.join(', '):''}${pool.length?' · Not correct (−1 each): '+pool.join(', '):''}`:` ✓ ${got}/${ws.length}`}
    if(got<ws.length)mistakes.push({k:`W${'AB'[k]}¶${p}`,mine:mine.join(', ')||'(empty)',right:ws.join(', ')});}));per.W=[hOk,hTot];}
  keys.forEach(([k,right,where])=>{const mine=ans[k]||'';const good=k[0]==='H'?fixOk(mine,E.fix[+k.slice(1)-1].w,right):(k[0]==='D'||k[0]==='G')?same(mine,right):mine===right;
    per[k[0]][1]++;if(good){ok++;per[k[0]][0]++}else mistakes.push({k,mine:mine||'(empty)',right});
    const fb=$('fb-'+k);if(fb){fb.className='fb '+(good?'ok':'no');fb.textContent=good?(k[0]==='H'?` ✓ (${where})`:' ✓'):` ✗ Correct answer: ${right}${where?' ('+where+')':''}`}
    $('exBox').querySelectorAll(`.opt[data-k="${k}"]`).forEach(b=>{b.disabled=true;if(b.dataset.v===right)b.classList.add('right');else if(b.dataset.v===mine)b.classList.add('wrong')})});
  if(E.seq)$('exBox').querySelectorAll('.seqc').forEach(c=>c.dataset.lock=1);
  ok+=hOk;const total=keys.length+hTot;const secs=Object.entries(per).filter(([,[,b]])=>b);const pct=Math.round(secs.reduce((a,[,[x,y]])=>a+100*x/y,0)/secs.length);
  $('exRes').innerHTML=`<p class="big">${pct}%</p><p>${ok}/${total} points</p><p>${Object.entries(per).map(([s,[a,b]])=>`${s}: ${a}/${b}`).join(' · ')}</p>`+
    (mistakes.length?`<div class="btns"><button id="explainAI">🤖 Explain my mistakes (mini-lesson)</button><button class="alt" id="retryEx">Try again</button></div>`:'<p>Perfect! 🎉</p>')+'<p class="status" id="exStatus">Sending your result to your teacher…</p>';
  if(mistakes.length){$('explainAI').onclick=()=>openAI(`You are my English teacher. I am a ${current.level} student at FreeWay (Mexico). I did the exercises for the reading "${current.title}". These are my mistakes:\n${mistakes.map(m=>`${m.k}: I wrote "${m.mine}", correct: "${m.right}"`).join('\n')}\nFor each mistake, explain briefly in simple English why the correct answer is right. Then group my mistakes by pattern and give me a MINI-LESSON for each pattern: the rule in simple words, 2 examples and 2 practice items. Wait for my answers and check them. Be kind and direct.\n\nTHE READING:\n${current.text}`);
    $('retryEx').onclick=()=>{for(const k in ans)delete ans[k];exHTML();scrollTo({top:0})}}
  const r=await post({kind:'exercises',student:w.s,group:w.g,reading:current.id,title:current.title,code:ls.get('fw_code',''),attempt:attempt('ex'),score:ok,total,pct,sections:Object.fromEntries(secs.map(([s,[a,b]])=>[s,Math.round(100*a/b)])),detail:Object.entries(per).map(([s,[a,b]])=>`${s} ${a}/${b}`).join(' · '),mistakes:mistakes.map(m=>m.k).join(' '),answers:mistakes.map(m=>`${m.k}: "${m.mine}" → ${m.right}`).join(' | ')});
  $('exStatus').textContent=r.ok?'Done! Your teacher has your result.':'Your result could not be sent. Check your internet.';
}
exHTML();

// ===== Writing =====
const W=current.writing;
if(W){$('wrBox').innerHTML=`<section class="card"><h2>F. Writing: ${esc(W.title)}</h2><p>${esc(W.task)}</p><p><b>Useful language · use at least 10 of these:</b><br>${esc(W.useful)}</p>
<textarea id="wtext" placeholder="Write here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<p class="status"><span id="wcount">0</span> words</p><div class="btns"><button id="wAI">🤖 Check my writing with AI</button></div><p class="status" id="wStatus">When you press the button, ChatGPT opens with your text ready. Just press send.</p></section>`;
  const t=$('wtext');t.value=ls.get('fw_w_'+current.id,'');const cnt=()=>{$('wcount').textContent=(t.value.trim().match(/\S+/g)||[]).length;ls.set('fw_w_'+current.id,t.value)};t.oninput=cnt;cnt();
  $('wAI').onclick=async()=>{const w=who();if(!w)return;const words=(t.value.trim().match(/\S+/g)||[]).length;if(words<20){alert('Write your text first.');return}
    openAI(`You are my English teacher. I am a ${current.level} student at FreeWay (Mexico). This is my writing for the reading "${current.title}".\nTASK: ${W.task}\nMY TEXT:\n${t.value}\n\n1) Give me a score out of 10 (content, organization, grammar, vocabulary). 2) Correct my errors and explain each one briefly in simple English. 3) Give me one MINI-LESSON on my most important error pattern, with 2 practice items, and check my answers. 4) Show me an improved version of my text. 5) At the end, write a short TEACHER REPORT: Student ${w.s} · Group ${w.g} · ${current.id} · Writing score · Main error patterns · One recommendation.`);
    const r=await post({kind:'writing',student:w.s,group:w.g,code:ls.get('fw_code',''),attempt:attempt('wr'),reading:current.id,title:current.title,words,text:t.value});
    $('wStatus').textContent=r.ok?'Your text was also sent to your teacher.':'ChatGPT opened, but your text could not be sent to your teacher.'};
}else $('wrBox').innerHTML='<div class="card">No writing task for this reading yet.</div>';
}
</script></body></html>
